# Debian's default Apache config ships `AllowOverride None` for /var/www/,
# which means .htaccess files are IGNORED unless explicitly re-enabled here.

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Makes /api/... map onto Backend/Api/... so the exact same
# Backend/Api/.htaccess used on Helios works unchanged here too.
Alias /api /var/www/html/Backend/Api

<Directory /var/www/html/Backend/Api>
    AllowOverride All
    Require all granted
</Directory>
